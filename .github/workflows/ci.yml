name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: tidy
        run: go mod tidy

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_SHA::12}" \
            -o dist/deepseek-tui-linux-amd64 .

      - name: smoke
        run: ./dist/deepseek-tui-linux-amd64 --version

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-tui-linux-amd64
          path: dist/deepseek-tui-linux-amd64
          if-no-files-found: error

      - name: upload go.sum
        uses: actions/upload-artifact@v4
        with:
          name: go-sum
          path: go.sum
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: build all targets
        run: |
          set -euo pipefail
          go mod tidy
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="deepseek-tui-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$out" .
          done
          cd dist
          sha256sum * > checksums.txt

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "deepseek-tui ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
